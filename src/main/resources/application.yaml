server:
  port: 8081

spring:
  application:
    name: ms-andesstay-reservations

  # Oracle Autonomous Database (OCI) con wallet mTLS. Secretos solo por variables de entorno.
  # Tests: perfil "test" con H2 (src/test/resources/application-test.yaml)
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@andesstaydb_tp?TNS_ADMIN=C:/oracle/wallet_andesstay}
    username: ${DB_USERNAME:ANDESSTAY}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/524de923-14d5-4e21-bbbf-525ca2e1ced7/
          jwk-set-uri: https://login.microsoftonline.com/524de923-14d5-4e21-bbbf-525ca2e1ced7/discovery/keys

  # EP3 - RabbitMQ. Con el cluster de infra/mq: RABBITMQ_ADDRESSES=localhost:5672,localhost:5673
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # EP5 - Kafka. Local: los 3 brokers de infra/kafka. Docker: KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-andesstay-reservations
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 10
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        spring.json.add.type.headers: false

# Nombres de la topologia (unica fuente de verdad; ver RabbitTopologyConfig)
andesstay:
  messaging:
    source: ms-andesstay-reservations
    dlq-retention: ${ANDESSTAY_DLQ_RETENTION:7d}
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    routes:
      email:
        queue: q.cmd.email
        dlq: q.cmd.email.dlq
        direct-key: email.send
        topic-pattern: "email.*"
        dead-key: email.dead
      housekeeping:
        queue: q.cmd.housekeeping
        dlq: q.cmd.housekeeping.dlq
        direct-key: housekeeping.ticket
        topic-pattern: "housekeeping.#"
        dead-key: housekeeping.dead
      voucher:
        queue: q.cmd.voucher
        dlq: q.cmd.voucher.dlq
        direct-key: voucher.gen
        topic-pattern: "voucher.*"
        dead-key: voucher.dead
    publishing:
      housekeeping-preparation-key: housekeeping.ticket.preparacion
      housekeeping-cleaning-key: housekeeping.ticket.limpieza

  # Integracion REST sincronica con catalog y audit (JWT del usuario propagado).
  # En Docker usar los nombres de servicio de infra/compose.yml, ej. CATALOG_URL=http://catalog:8085
  services:
    catalog:
      url: ${CATALOG_URL:http://localhost:8085}
    audit:
      url: ${AUDIT_URL:http://localhost:8086}
    connect-timeout: 2s
    read-timeout: 5s

  # EP5 - Topicos Kafka que este microservicio declara (KafkaTopicConfig los crea al arrancar).
  # Valores del caso (seccion 9): 3 particiones, 3 replicas, cleanup delete, retencion 3-7 dias.
  kafka:
    topics:
      reservation-events:
        name: reservations.events
        partitions: 3
        replicas: 3
        retention: ${KAFKA_RESERVATIONS_RETENTION:7d}
        min-insync-replicas: 2

# Solo /actuator/health (healthcheck de Docker)
management:
  endpoints:
    web:
      exposure:
        include: health
